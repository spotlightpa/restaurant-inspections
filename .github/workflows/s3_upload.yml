name: Upload Inspections Data to S3

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '47 7 * * *'

permissions:
  actions: write
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies from requirements.txt
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Verify Installed Packages
        run: pip list

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/555131507737/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "botlight@botlight-pa.iam.gserviceaccount.com"

      - name: Run scraper and upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_FILE_NAME: ${{ secrets.S3_FILE_NAME }}
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -m pip list
          python scraper.py

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create keepalive commit
        run: |
          echo "Keepalive: $(date)" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive commit [skip ci]" || echo "No changes to commit"
          git push origin master
